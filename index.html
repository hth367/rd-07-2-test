<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест за проверка на знанията</title>
<style>
body{margin:0;background:#f4f6f8;color:#1f2937;font-family:Arial,sans-serif;line-height:1.45}
.wrap{max-width:820px;margin:auto;padding:24px 16px 48px}
h1{text-align:center;font-size:28px;margin:0 0 8px}
.sub{text-align:center;color:#667085;margin:0 0 18px}
.card{background:#fff;padding:22px;border-radius:18px;box-shadow:0 10px 28px rgba(0,0,0,.08);margin-top:18px}
.note{background:#fff7ed;border-left:5px solid #d97706;padding:13px;border-radius:9px;color:#7c2d12}
.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:14px 0 18px}
.bar{height:100%;background:#d97706;width:0}
.q{font-size:21px;font-weight:700;margin:10px 0 18px}
.opts{display:grid;gap:10px}
.opt{padding:14px;border:1px solid #d0d5dd;border-radius:12px;background:#f8fafc;text-align:left;font-size:16px;font-weight:600;cursor:pointer}
.opt.sel{border-color:#d97706;background:#fff7ed}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
button{border:0;border-radius:12px;padding:13px 17px;font-size:16px;font-weight:700;cursor:pointer}
.prev{background:#e5e7eb}
.next,.again{background:#d97706;color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none}
.status{text-align:center;font-size:30px;font-weight:800}
.pass{color:#166534} .fail{color:#b91c1c}
.big{text-align:center;font-size:50px;font-weight:800;color:#b45309;margin-top:8px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.metric{text-align:center;border:1px solid #d0d5dd;border-radius:12px;padding:13px}
.metric b{font-size:23px;display:block}
.item{border:1px solid #fecaca;background:#fffafa;border-radius:12px;padding:15px;margin:12px 0}
.rq{font-weight:700}
.yours{color:#b91c1c;margin-top:8px}
.right{color:#166534;font-weight:700;margin-top:6px}
.why{color:#475467;margin-top:7px;font-size:14px}
.footer{text-align:center;color:#667085;font-size:13px;margin-top:18px}
.again{width:100%;margin-top:18px}
@media(max-width:560px){h1{font-size:23px}.q{font-size:19px}.metrics{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>Тест за проверка на знанията</h1>
<p class="sub">Обучение по чл. 6, ал. 1, т. 1–3 от Наредба № РД-07-2/16.12.2009 г.</p>

<section id="quiz" class="card">
<div class="note">Всеки въпрос има само един верен отговор. Тестът е издържан при 12 или повече верни отговора от 15.</div>
<p id="count"></p>
<div class="progress"><div id="bar" class="bar"></div></div>
<div id="q" class="q"></div>
<div id="opts" class="opts"></div>
<div class="nav">
<button id="prev" class="prev">Назад</button>
<button id="next" class="next" disabled>Напред</button>
</div>
</section>

<section id="result" class="card hidden">
<div id="status" class="status"></div>
<div id="big" class="big"></div>
<p id="pct" class="sub"></p>
<div class="metrics">
<div class="metric"><b id="good"></b>Верни</div>
<div class="metric"><b id="bad"></b>Грешни</div>
<div class="metric"><b id="per"></b>Резултат</div>
</div>
<h2>Сгрешени въпроси</h2>
<div id="review"></div>
<button id="again" class="again">Направи теста отново</button>
</section>

<div class="footer">СТМ „Медико“ ЕООД</div>
</div>

<script>
const Q = [{"q": "Колко често се провежда обучението на длъжностните лица, които ръководят и управляват трудовите процеси (чл. 6, ал. 1, т. 1)?", "o": ["Веднъж годишно", "Не по-рядко от веднъж на 2 години", "Веднъж на 5 години", "Само при постъпване на работа"], "c": 1, "w": "Основание: чл. 6, ал. 1, т. 1 от Наредба № РД-07-2."}, {"q": "Колко често се провежда обучението на лицата, определени да провеждат инструктажите (чл. 6, ал. 1, т. 3)?", "o": ["Не по-рядко от веднъж годишно", "Не по-рядко от веднъж на 2 години", "Веднъж на 3 години", "По преценка на лицето"], "c": 0, "w": "Основание: чл. 6, ал. 1, т. 3."}, {"q": "Кой утвърждава програмата за инструктаж и инструкциите за безопасна работа?", "o": ["Службата по трудова медицина", "Комитетът по условия на труд", "Работодателят", "Инспекцията по труда"], "c": 2, "w": "Основание: чл. 10–13. Програмата и инструкциите се утвърждават от работодателя."}, {"q": "Кога се провежда началният инструктаж?", "o": ["До 7 дни след постъпване", "След изготвяне на оценката на риска", "В деня на постъпване, преди започване на работа", "При първия периодичен инструктаж"], "c": 2, "w": "Основание: чл. 12."}, {"q": "Монтажници на външна фирма ще работят на площадката. Подлежат ли на начален инструктаж?", "o": ["Не – инструктират се от своя работодател", "Само ако работят повече от 1 месец", "Само ако извършват огневи работи", "Да – началният инструктаж обхваща и външните лица"], "c": 3, "w": "Основание: чл. 11, ал. 1."}, {"q": "Какво удостоверява подписът на ръководителя в кол. 9 на книгата за инструктаж на РМ, периодичен и извънреден?", "o": ["Допускането до самостоятелна работа – само при инструктаж на РМ", "Провеждането на всеки периодичен инструктаж", "Проведен извънреден инструктаж", "Получаване на ЛПС"], "c": 0, "w": "Основание: чл. 13, ал. 7."}, {"q": "Оператор ще обслужва екстрактора и вакуумните колони. Кога може да работи самостоятелно?", "o": ["Веднага след началния инструктаж", "След инструктаж на РМ, обучение и успешен изпит", "След 1 месец работа под наблюдение", "След периодичния инструктаж"], "c": 1, "w": "Основание: чл. 13, ал. 2–4."}, {"q": "Каква е минималната периодичност на периодичния инструктаж за непосредствено заетите с опасни химични агенти?", "o": ["Веднъж годишно", "Веднъж на 6 месеца", "Веднъж на 3 месеца", "Ежемесечно"], "c": 2, "w": "Основание: чл. 14, ал. 2 и чл. 15, ал. 1."}, {"q": "Периодичен инструктаж с периодичност 3 месеца е проведен на 30.11.2026 г. До коя дата трябва да се проведе следващият?", "o": ["01.03.2027 г.", "28.02.2027 г.", "30.03.2027 г.", "31.03.2027 г."], "c": 1, "w": "Основание от ключа: изчисляване на срок в месеци."}, {"q": "Как се документира ежедневният инструктаж?", "o": ["В книгата за начален инструктаж", "Не се документира", "В отделна книга за ежедневен инструктаж – с кратко съдържание в кол. 5", "Само в електронен дневник на смяната"], "c": 2, "w": "Основание: чл. 15 и Приложение № 1."}, {"q": "Кое от изброените е основание за извънреден инструктаж?", "o": ["Въвеждане на нов препарат за CIP почистване", "Начало на календарната година", "Смяна на ръководителя на ДЛ по чл. 24", "Посещение на клиент на площадката"], "c": 0, "w": "Основание: чл. 16, ал. 1 – промяна в технологията."}, {"q": "Работник се връща след 60 календарни дни отсъствие. Какво е необходимо преди да започне работа?", "o": ["Нищо – инструктиран е преди отсъствието", "Нов начален инструктаж", "Само подпис в кол. 9", "Извънреден инструктаж"], "c": 3, "w": "Основание: чл. 16, ал. 2 – отсъствие над 45 календарни дни."}, {"q": "Какво е задължително преди влизане в резервоар или биореактор?", "o": ["Само устно съгласие на колега", "Писмено разрешение, изключване и изолиране, измерване на O₂ и газове, наблюдаващ отвън", "Само противогаз", "Достатъчно е съдът да е празен"], "c": 1, "w": "Основание от ключа: инструкции за работа в ограничени пространства."}, {"q": "Защо азотът е опасен при работа в резервоари?", "o": ["Запалим е", "Корозивен е за кожата", "Без мирис е и измества кислорода – води до задушаване", "Токсичен е при контакт с кожата"], "c": 2, "w": "Основание от ключа: опасности по участъци."}, {"q": "Допуснали сте грешка в книгата за инструктаж. Как се коригира?", "o": ["С коректор и нов текст отгоре", "Зачертава се с една черта, вписва се верният текст и се парафира, без задна дата", "Страницата се изрязва и се попълва нова", "Грешният ред се оставя, без отбелязване"], "c": 1, "w": "Основание от ключа: правила за документиране."}];
const L = ["а","б","в","г"];
let i = 0;
let answers = Array(Q.length).fill(null);
const el = id => document.getElementById(id);

function render() {
  el("count").textContent = `Въпрос ${i+1} от ${Q.length}`;
  el("bar").style.width = `${((i+1)/Q.length)*100}%`;
  el("q").textContent = Q[i].q;
  el("opts").innerHTML = "";

  Q[i].o.forEach((text, n) => {
    const b = document.createElement("button");
    b.className = "opt" + (answers[i] === n ? " sel" : "");
    b.textContent = `${L[n]}) ${text}`;
    b.onclick = () => {
      answers[i] = n;
      render();
    };
    el("opts").appendChild(b);
  });

  el("prev").disabled = i === 0;
  el("next").disabled = answers[i] === null;
  el("next").textContent = i === Q.length - 1 ? "Завърши теста" : "Напред";
}

el("prev").onclick = () => {
  if (i > 0) {
    i--;
    render();
  }
};

el("next").onclick = () => {
  if (answers[i] === null) return;
  if (i < Q.length - 1) {
    i++;
    render();
  } else {
    finish();
  }
};

function finish() {
  const good = Q.reduce((sum, q, n) => sum + (answers[n] === q.c ? 1 : 0), 0);
  const bad = Q.length - good;
  const pct = Math.round(good / Q.length * 100);
  const passed = good >= 12;

  el("quiz").classList.add("hidden");
  el("result").classList.remove("hidden");
  el("status").textContent = passed ? "ИЗДЪРЖАЛ" : "НЕИЗДЪРЖАЛ";
  el("status").className = "status " + (passed ? "pass" : "fail");
  el("big").textContent = `${good} / ${Q.length}`;
  el("pct").textContent = `${pct}% верни отговори`;
  el("good").textContent = good;
  el("bad").textContent = bad;
  el("per").textContent = pct + "%";
  el("review").innerHTML = "";

  if (bad === 0) {
    el("review").innerHTML = '<div class="item"><div class="right">Всички отговори са верни.</div></div>';
  } else {
    Q.forEach((q, n) => {
      if (answers[n] !== q.c) {
        const d = document.createElement("div");
        d.className = "item";
        d.innerHTML = `
          <div class="rq">${n+1}. ${q.q}</div>
          <div class="yours">Ваш отговор: ${L[answers[n]]}) ${q.o[answers[n]]}</div>
          <div class="right">Верен отговор: ${L[q.c]}) ${q.o[q.c]}</div>
          <div class="why">${q.w}</div>`;
        el("review").appendChild(d);
      }
    });
  }
  window.scrollTo({top:0, behavior:"smooth"});
}

el("again").onclick = () => {
  i = 0;
  answers = Array(Q.length).fill(null);
  el("result").classList.add("hidden");
  el("quiz").classList.remove("hidden");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
};

render();
</script>
</body>
</html>
